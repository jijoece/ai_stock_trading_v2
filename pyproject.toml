[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-research"
version = "0.1.0"
description = "Local-first, read-only research pipeline for AI-driven stock research architecture investigation (no live trading)."
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.116.0",
    "mcp>=1.28.1",
    "jsonschema>=4.26.0",
    "PyYAML>=6.0.3",
    "python-dotenv>=1.2.2",
    "httpx>=0.28.0",
    "pandas>=2.2.0",
    "streamlit>=1.36.0",
    "vaderSentiment>=3.3.2",
    # PR 3 will replace evaluation/market_calendar.py with this library; it is
    # base application infrastructure, not an optional extra, once that
    # migration lands. See docs/library-migration/DECISIONS.md.
    "exchange_calendars>=4.13,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.161,<7",
    "time-machine>=3.2,<4",
]
# PR 4 candidate: technical-indicator library replacing scripts/indicators.py.
# TA-Lib ships prebuilt binary wheels for supported CPython/OS/arch
# combinations (see docs/library-migration/DEPENDENCY_MATRIX.md); a system
# package/source install is only a documented fallback if a target platform
# lacks a compatible wheel, never an unconditional prerequisite.
indicators = [
    "TA-Lib>=0.7.1,<0.8",
]
# PR 11 candidate: empyrical-reloaded is the authoritative primitive-metrics
# library (returns/annualization/Sharpe/Sortino/drawdown/alpha-beta);
# quantstats-lumi is reporting/presentation only (tear sheets, tables,
# charts) and must not become a second authority over the same primitives.
analytics = [
    "empyrical-reloaded>=0.5.12,<0.6",
    "quantstats-lumi>=1.1.5,<2",
]
# PR 15/16 candidates: structured logging and additive tracing/metrics.
observability = [
    "structlog>=26.1,<27",
    "opentelemetry-api>=1.44,<2",
    "opentelemetry-sdk>=1.44,<2",
]
# Milestone 3: LumiBot paper-execution runtime adapter, isolated behind
# src/trading_research/runtime/lumibot/ (see docs/milestone3-lumibot-paper-integration.md).
# Deliberately NOT a base dependency: lumibot pulls ~140 transitive packages
# unrelated to this project (langchain, google-adk, kubernetes client,
# openai, ...) and its own pins downgrade jsonschema/python-dotenv below the
# floor declared above. Install in an isolated environment; the full test
# suite never requires this extra (lumibot-specific tests use
# pytest.importorskip).
paper = [
    "lumibot==4.5.78",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = [
    "paper_broker: opt-in real credentialed paper-broker smoke test (Milestone 4) — requires RUN_PAPER_BROKER_TESTS=true and real Alpaca paper credentials; skipped by default, never run automatically just because credentials happen to be present.",
    "external_paper_broker: opt-in isolated Alpaca paper-boundary smoke workflow (Milestone 11) — requires RUN_EXTERNAL_PAPER_BROKER_TESTS=true, explicit external configuration, an approved bounded intent, and real Alpaca paper credentials; skipped by default.",
    "claude_api: opt-in real Claude API structured-output smoke test (Milestone 5) — requires RUN_CLAUDE_RESEARCH_TESTS=true and a real ANTHROPIC_API_KEY plus research.model configured; skipped by default, never run automatically just because credentials happen to be present.",
    "sec_api: opt-in real SEC EDGAR smoke test (Milestone 6) — requires RUN_SEC_API_TESTS=true; skipped by default. No credentials are required by SEC EDGAR itself, but this still never runs automatically.",
    "market_data_api: opt-in real Alpaca market-data smoke test (Milestone 6) — requires RUN_MARKET_DATA_TESTS=true and real Alpaca credentials; skipped by default, never run automatically just because credentials happen to be present.",
    "news_api: opt-in real news-provider smoke test (Milestone 6) — requires RUN_NEWS_API_TESTS=true and a real news-provider API key; skipped by default.",
    "real_research_cycle: opt-in real scheduled-research-cycle smoke test (Milestone 6) — requires RUN_REAL_RESEARCH_CYCLE=true; skipped by default.",
    "corporate_status_real: opt-in real SEC-derived corporate-status smoke test (Milestone 7) — requires RUN_CORPORATE_STATUS_TESTS=true; skipped by default. No credentials required by SEC EDGAR itself, but this still never runs automatically.",
    "reddit_sentiment_real: opt-in real Reddit sentiment smoke test (Milestone 7) — requires RUN_REDDIT_SENTIMENT_TESTS=true and real Reddit credentials; skipped by default.",
    "reddit_free_real: opt-in credential-free Reddit RSS smoke test — requires RUN_REDDIT_FREE_TESTS=1; skipped by default.",
    "real_shadow_cycle: opt-in real shadow-cycle smoke test (Milestone 7) — requires RUN_REAL_SHADOW_CYCLE=true; skipped by default.",
    "real_claude_shadow_cycle: opt-in real Claude shadow-cycle smoke test (Milestone 7) — requires RUN_REAL_CLAUDE_SHADOW_CYCLE=true and a real ANTHROPIC_API_KEY; skipped by default. This is a real, small-cost Claude API call.",
]

[tool.pyright]
include = ["src", "tests"]
exclude = [
    "**/__pycache__",
    "**/*.egg-info",
    ".venv",
    ".pytest_cache",
    "paper_runtime",
]
venvPath = "."
venv = ".venv"
pythonVersion = "3.10"
typeCheckingMode = "basic"
