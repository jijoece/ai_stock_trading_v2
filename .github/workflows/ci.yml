name: CI

# Offline-only CI: no credentials are configured anywhere in this workflow,
# so every opt-in real-provider/broker smoke test (gated on RUN_*_TESTS env
# vars that are never set here) stays skipped automatically.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  main-tests:
    name: main-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run main test suite
        run: pytest tests/ -q --tb=short

  paper-runtime-tests:
    name: paper-runtime-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install paper_runtime dependencies
        working-directory: paper_runtime
        run: pip install -e ".[dev]"
      - name: Run paper_runtime test suite
        working-directory: paper_runtime
        run: pytest tests/ -q --tb=short

  type-check:
    name: type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install main package + pyright
        run: |
          pip install -e ".[dev]"
          pip install pyright
      # Non-blocking: the codebase has a large pre-existing pyright error
      # baseline (mostly implicit-Optional narrowing in test fixtures,
      # predating this milestone) that a hard gate would fail on
      # unconditionally. This still runs on every PR and surfaces the
      # count so regressions are visible, without turning every build red
      # for a pre-existing condition unrelated to the change under review.
      - name: Run pyright (main package)
        run: pyright
        continue-on-error: true
      - name: Install paper_runtime package
        working-directory: paper_runtime
        run: pip install -e ".[dev]"
      - name: Run pyright (paper_runtime)
        working-directory: paper_runtime
        run: pyright
        continue-on-error: true

  python-3-10-floor:
    name: python-3-10-floor
    runs-on: ubuntu-latest
    # Blocking job substantiating the declared `requires-python = ">=3.10"`
    # floor in both pyproject.toml files. The main-tests job above runs on
    # 3.11 (matching CI's historical choice), which does not prove the
    # floor actually resolves and passes; this job does.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: pip check
        run: pip check
      - name: Run main test suite
        run: pytest tests/ -q --tb=short

  indicators-tests:
    name: indicators-tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # Blocking job proving TA-Lib parity for real (library-migration PR 4):
    # main-tests above only installs `.[dev]`, so tests/unit/test_indicators.py
    # skips there (see its `I` fixture) rather than exercising TA-Lib. This
    # job installs the `indicators` extra and asserts it resolves cleanly,
    # then runs the same file with TA-Lib actually present, so a real
    # regression in scripts/indicators.py cannot be masked by the skip in
    # main-tests. Matrixed over the declared `requires-python = ">=3.10"`
    # floor and CI's historical 3.11 choice -- the separate
    # `python-3-10-floor` job below only installs `.[dev]` (no `indicators`
    # extra), so it does not actually exercise TA-Lib on 3.10; this job does.
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies + indicators extra
        run: pip install -e ".[dev,indicators]"
      - name: pip check
        run: pip check
      - name: Run indicator-focused tests
        run: pytest tests/unit/test_indicators.py -q --tb=short

  research-tests:
    name: research-tests
    runs-on: ubuntu-latest
    # Blocking job proving VectorBT parity for real (library-migration PR 5):
    # main-tests above only installs `.[dev]`, so the behavioral tests in
    # tests/unit/test_vector_research_adapter.py skip there (see its `adapter`
    # fixture) rather than exercising VectorBT. This job installs the
    # `research` extra and asserts it resolves cleanly, then runs the same
    # file with VectorBT actually present. Single Python 3.11 leg only --
    # unlike `indicators-tests` above, VectorBT's own `Requires-Python:
    # >=3.11,<3.15` classifier makes a 3.10 leg unresolvable by construction
    # (this project's own floor stays `>=3.10`; see pyproject.toml's
    # `research` extra comment and docs/library-migration/DECISIONS.md D4).
    #
    # Also runs the *full* offline suite with `research` installed (review
    # fix, PR 5): the focused file alone proves the adapter's own behavior
    # but not that adding VectorBT's numpy/pandas floor to the environment
    # leaves the rest of the main package importable and passing. Any
    # skip elsewhere in this run must be an expected optional-extra skip
    # (e.g. `indicators`/`analytics`/`observability` not installed here),
    # never a failure hidden because a module could not import.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies + research extra
        run: pip install -e ".[dev,research]"
      - name: pip check
        run: pip check
      - name: Run vector_research-focused tests
        run: pytest tests/unit/test_vector_research_adapter.py tests/unit/test_vector_research_import_boundary.py -q --tb=short
      - name: Run full offline suite with the research extra installed
        run: pytest tests/ -q --tb=short

  dependency-extras-smoke:
    name: dependency-extras-smoke (${{ matrix.extra }})
    runs-on: ubuntu-latest
    # Blocking, credential-free smoke test for each optional dependency
    # group added by library-migration PR 1 (plus `research`, added by PR 5).
    # Each extra is installed in its own job/environment, never combined
    # with another extra, to preserve the isolation the migration plan
    # requires (see docs/library-migration/DEPENDENCY_MATRIX.md Section 3).
    # Without this, the main-tests job (which only installs ".[dev]") never
    # actually resolves or imports these dependencies, so dependency drift
    # or a broken wheel would go undetected by CI.
    strategy:
      fail-fast: false
      matrix:
        include:
          - extra: indicators
            import_check: "import talib; print(talib.__version__)"
          - extra: analytics
            import_check: "import empyrical, quantstats_lumi; print(empyrical.__version__, quantstats_lumi.__version__)"
          - extra: observability
            import_check: "import structlog; import opentelemetry.sdk; print(structlog.__version__)"
          - extra: research
            import_check: "import vectorbt; print(vectorbt.__version__)"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install "${{ matrix.extra }}" extra only
        run: pip install -e ".[${{ matrix.extra }}]"
      - name: pip check
        run: pip check
      - name: Bounded import check
        run: python -c "${{ matrix.import_check }}"

  backtest-runtime-tests:
    name: backtest-runtime-tests
    runs-on: ubuntu-latest
    # Blocking job for library-migration PR 6
    # (docs/adr/0009-lumibot-backtest-distribution-boundary.md Decision 4).
    # backtest_runtime/ is installed alone, in its own environment -- never
    # combined with the root project or paper_runtime, matching the existing
    # never-combine-extras convention (indicators/analytics/observability/
    # research above, paper-runtime-tests). Matrixed over this distribution's
    # declared Python floor (requires-python = ">=3.10") and CI's historical
    # 3.11 choice -- matching the indicator-tests floor+ceiling pattern above,
    # since nothing else in this job proves either version actually resolves
    # and passes.
    # backtest_runtime/tests/ has no importorskip guard anywhere: LumiBot is
    # a base dependency of this distribution, so every test here fails,
    # rather than skips, if it is somehow missing.
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install backtest_runtime dependencies
        working-directory: backtest_runtime
        run: pip install -e ".[dev]"
      - name: pip check
        working-directory: backtest_runtime
        run: pip check
      - name: Assert resolved LumiBot version is exactly 4.5.78
        working-directory: backtest_runtime
        run: pip show lumibot | grep -qx "Version: 4.5.78"
      - name: Run backtest_runtime test suite
        working-directory: backtest_runtime
        # Exercises all five ADR 0009 Decision 2 credential-safety
        # properties (test_credential_safety.py, test_network_safety.py) in
        # addition to the contract/determinism/import-boundary/version-pin
        # tests -- see that directory's test files for the full breakdown.
        run: pytest tests/ -q --tb=short

  type-check-safety:
    name: type-check-safety
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install main package + pyright
        run: |
          pip install -e ".[dev]"
          pip install pyright
      # Milestone 12.1 Item 10: BLOCKING type-check gate scoped to the
      # production modules this milestone's provider/health/CI-integrity
      # work modified (pyright-safety.json's `include` list) — deliberately
      # narrower than, and in addition to, the non-blocking whole-project
      # `type-check` job above. No `continue-on-error` here: this must stay
      # at 0 errors, never globally suppressed.
      - name: Run pyright (safety-critical subset, blocking)
        run: pyright --project pyright-safety.json

  migration-smoke:
    name: migration-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Fresh database schema applies cleanly
        run: |
          python -c "
          import tempfile
          from pathlib import Path
          from trading_research.storage.database import connect

          with tempfile.TemporaryDirectory() as tmp:
              conn = connect(Path(tmp) / 'fresh.sqlite3')
              tables = {
                  row[0] for row in conn.execute(
                      \"SELECT name FROM sqlite_master WHERE type='table'\"
                  ).fetchall()
              }
              assert 'paper_external_order_leases' in tables
              assert 'paper_external_position_reservation_events' in tables
              conn.close()
          print('fresh schema smoke OK')
          "
      - name: Reopening an existing database re-applies additive upgrades idempotently
        run: |
          python -c "
          import tempfile
          from pathlib import Path
          from trading_research.storage.database import connect

          with tempfile.TemporaryDirectory() as tmp:
              db_path = Path(tmp) / 'existing.sqlite3'
              first = connect(db_path)
              first.close()
              second = connect(db_path)
              cols = {
                  row[1] for row in second.execute(
                      'PRAGMA table_info(paper_external_order_events)'
                  ).fetchall()
              }
              assert 'scope_sequence' in cols
              second.close()
          print('upgrade schema smoke OK')
          "
      - name: Milestone 12.1 structured-failure/reasoning-token/adapter-version columns and scheduled-run index exist
        run: |
          python -c "
          import tempfile
          from pathlib import Path
          from trading_research.storage.database import connect
          from trading_research.storage.schema_version import CURRENT_SCHEMA_VERSION

          with tempfile.TemporaryDirectory() as tmp:
              conn = connect(Path(tmp) / 'm12_1.sqlite3')
              cols = {row[1] for row in conn.execute('PRAGMA table_info(research_attempts)').fetchall()}
              for expected in (
                  'failure_code', 'failure_stage', 'failure_retryable', 'failure_metadata_json',
                  'provider_adapter_version', 'reasoning_output_tokens', 'token_accounting_policy',
              ):
                  assert expected in cols, expected
              indexes = {
                  row[1] for row in conn.execute(\"PRAGMA index_list(evidence_provider_requests)\").fetchall()
              }
              assert 'idx_evidence_provider_requests_scheduled_run' in indexes
              assert CURRENT_SCHEMA_VERSION >= 9
              conn.close()
          print('Milestone 12.1 schema smoke OK')
          "
