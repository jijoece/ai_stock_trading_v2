# Version-controlled deterministic strategy-scanner configuration
# (Milestone 23, B1-B6). Zero LLM calls read or write this file at runtime;
# thresholds are only changed by editing this file.
version: 1

# Activation stage (B9). Deterministic strategy candidate selection is
# disabled by default — enabling it does not submit orders on its own,
# but the flag stays false until the shortlist layer has been reviewed.
#
# activation_stage records progress through the required 7-stage rollout
# (see ACTIVATION_STAGES in strategies/config.py and
# docs/strategy-candidate-selection.md):
#   STAGE_1_OFFLINE_FIXTURES -> STAGE_2_HISTORICAL_BACKTEST ->
#   STAGE_3_DAILY_READ_ONLY_CANDIDATE_LIST ->
#   STAGE_4_SHADOW_RECOMMENDATION_TRACKING -> STAGE_5_LOCAL_PAPER_BOOK ->
#   STAGE_6_SUPERVISED_ALPACA_PAPER -> STAGE_7_MULTI_DAY_PAPER_SOAK
# `enabled` cannot be true while still at stage 1 or 2 (loader-enforced).
strategy_candidate_selection:
  enabled: false
  activation_stage: STAGE_2_HISTORICAL_BACKTEST

# Per-strategy operating controls (docs/automated-live-trading-implementation-plan.md Phase 2).
# Optional; a strategy left out gets these defaults. Read by the paper bridge only; no setting here
# can send an order.
#   mode: backtest | shadow | paper. `live` is recognised but refused by the loader while ADR 0010 is
#     not accepted. Only `paper` signals reach the local paper book.
#   activation_stage: this strategy's own stage. It may not be past the global stage above, which is the
#     ceiling. Defaults to the global stage.
#   symbol_allowlist: symbols this strategy may enter. Empty or absent means no restriction.
#   capital_budget_usd: most notional the strategy may hold plus have pending. Absent means none.
#   risk_budget_fraction: most planned open risk (shares x (entry - stop)) as a fraction of book
#     equity. Absent means none.
#   signal_validity_sessions: a signal is valid until the close of this many sessions after its own
#     session. Later signals are skipped, never acted on late. Default 1.
strategy_controls:
  momentum_breakout:
    mode: paper
    signal_validity_sessions: 1
  mean_reversion:
    mode: paper
    signal_validity_sessions: 1
  event_catalyst:
    mode: paper
    signal_validity_sessions: 1
  # Research-only (docs/intraday-earnings-gap-plan.md). The loader refuses any mode but `backtest`
  # (paper, shadow, live) until a separate paper plan exists; it never reaches the paper bridge.
  earnings_gap_intraday:
    mode: backtest

momentum_breakout:
  enabled: true
  breakout_lookback_days: 20
  trend_sma_days: 50
  trend_slope_lookback_days: 5
  volume_lookback_days: 20
  minimum_volume_ratio: 1.5
  minimum_relative_strength: 0.0
  maximum_breakout_extension_percent: 3.0
  atr_period: 14
  atr_stop_multiple: 2.0
  maximum_holding_days: 20

mean_reversion:
  enabled: true
  mean_lookback_days: 20
  zscore_entry_threshold: -2.0
  rsi_period: 14
  maximum_entry_rsi: 30.0
  long_trend_sma_days: 200
  require_price_above_long_trend: true
  atr_period: 14
  atr_stop_multiple: 1.5
  maximum_holding_days: 10

event_catalyst:
  enabled: true
  maximum_event_age_hours: 72.0
  minimum_volume_ratio: 1.5
  volume_lookback_days: 20
  maximum_gap_percent: 8.0
  confirmation_window_days: 3
  maximum_holding_days: 15
  minimum_positive_response_percent: 1.0
  atr_period: 14
  atr_stop_multiple: 2.0

shortlist:
  maximum_candidates_per_strategy: 5
  maximum_combined_shortlist: 10
  maximum_symbols_to_research_per_day: 3
  maximum_fresh_research_cycles_per_day: 3
  minimum_signal_strength_for_research: 0.0
  # Milestone 24 Part C6: real per-symbol pre-research filter, replacing the
  # misleading portfolio-exposure<100% gate. A symbol already within
  # minimum_candidate_allocation_fraction of the cap cannot receive any
  # allowed allocation, so it is excluded before it ever consumes a
  # research token. This conservative 8% research prefilter is intentionally
  # below the standing 10% paper-book execution-risk cap; the execution risk
  # gate remains authoritative and this value must never exceed that cap.
  maximum_symbol_allocation_fraction: 0.08
  minimum_candidate_allocation_fraction: 0.01

# Intraday earnings-gap research strategy (docs/intraday-earnings-gap-plan.md). BACKTEST ONLY: it has
# no paper path, is not in the shortlist or candidate/shadow loops, and the global activation_stage
# above does not change. Percent fields are percentages (5 = 5%); *_fraction are fractions; *_bps are
# basis points. Times are quoted ET wall-clock "HH:MM" strings (an unquoted 16:30 is a YAML base-60
# integer). Changing any value changes the run identity.
earnings_gap_intraday:
  # Common eligibility (plan 5.2)
  minimum_price: 3
  minimum_avg_dollar_volume: 5000000
  history_sessions: 20
  # Pre-market / post-market signals (plan 5.1-5.2)
  minimum_gap_percent: 5
  minimum_premarket_rel_volume: 3
  premarket_history_sessions: 20
  post_signal_time: "16:30"
  premarket_decision_time: "09:25"
  premarket_entry_first_decision_time: "08:00"
  # Entry and exit clock (plan 5.3-5.6)
  opening_range_minutes: 15
  earliest_entry_time: "09:45"
  pmh_break_earliest_entry_time: "09:35"
  latest_entry_time: "14:30"
  flat_time: "15:55"
  overnight_flat_time: "10:30"
  post_market_exit: false
  # Guards and sizing (plan 5.4-5.5)
  maximum_risk_percent: 8
  maximum_trades_per_day: 3
  maximum_losses_per_day: 2
  minimum_extended_fill_usd: 1000
  extended_participation: 0.02
  regular_participation: 0.01
  risk_fraction: 0.005
  maximum_position_fraction: 0.10
  # Costs (plan D6): slippage per side plus max(floor, k x first bar (high - low) / close in bps)
  slippage_bps: 10
  spread_floor_bps: 5
  spread_k: 0.1
  extended_spread_floor_bps: 30
  extended_spread_k: 0.25
  vwap_stop_percent: 1
  # D9: post-market end on early-close days. Alpaca runs no stock after-hours session on half-days
  # (docs.alpaca.markets/docs/245-trading, checked 2026-11-20), so it equals the 13:00 early close.
  early_close_postmarket_end: "13:00"
  # Fraction by which summed 5-minute regular volume may differ from the daily bar before it is flagged
  volume_tolerance: 0.20
  # D7 chronological split: parameters are chosen only on the earliest fraction of event dates
  in_sample_fraction: 0.6
  # Optional market-trend filter: off in v1 but recorded
  trend_filter_enabled: false
  trend_benchmark: SPY
  trend_sma_sessions: 50

