# Library-migration automation configuration.
#
# The committed default is OFF. Merging the automation infrastructure must not
# start the automation; the repository owner enables it deliberately.
#
# The substantive roadmap lives in docs/library-migration/MASTER_PLAN.md and
# STATUS.md. Nothing in this file decides what a phase contains or which phase
# runs next. See docs/library-migration/AUTOMATION.md.

enabled: false

# Migration branches are named `migration/<row>-<slug>` (migration/09-...).
branch_prefix: "migration/"

claude:
  # MASTER_PLAN.md already assigns a risk and a recommended model per row; that
  # assignment wins. These are the defaults used when a row names none.
  implementation_model: sonnet
  escalation_model: opus
  quota_retry_hours: 3
  max_attempts_per_run: 1

review:
  provider: codex
  max_rounds: 3
  max_reviews_per_sha: 1
  blocking_severity: P2

planner:
  provider: openai
  max_calls_per_phase: 2

merge:
  automatic: false
